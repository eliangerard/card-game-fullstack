# nginx de Roña: estáticos del cliente + proxy a rona-server (Socket.IO y /health).
# Delante va cloudflared (Cloudflare Tunnel), que manda la IP del jugador en CF-Connecting-IP.

# IP real del cliente: la de Cloudflare si viene; si no (pruebas locales), la de la conexión.
# Nadie más que cloudflared (o tú en 127.0.0.1:8090) llega a este nginx, así que se le puede creer.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Cloudflare manda X-Forwarded-Proto: https; en pruebas locales no viene
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

log_format rona '$client_ip - [$time_local] "$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" rt=$request_time';

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log rona;
    server_tokens off;
    client_max_body_size 64k;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff application/manifest+json;

    # DNS de Docker: re-resuelve rona-server si el contenedor se recrea con otra IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rona_server http://rona-server:3001;

    proxy_http_version 1.1;

    location /socket.io/ {
        proxy_pass $rona_server;
        # X-Forwarded-For se REEMPLAZA (no se añade) por la IP real: así lo que mande el cliente no se
        # cuela y el servidor (TRUST_PROXY=1) cuenta a cada jugador aparte. Ojo: un proxy_set_header
        # dentro de un location anula TODOS los heredados del server, por eso van repetidos aquí.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Las partidas son largas y el socket puede pasar ratos sin tráfico (Socket.IO hace ping cada 25 s)
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass $rona_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        access_log off;
    }

    # Archivos de vite con hash en el nombre: no cambian nunca
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html siempre fresco, para que un despliegue nuevo se vea al recargar
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta que no sea un archivo devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Fuentes e imágenes de public/ (sin hash): un día
    location ~* \.(?:woff2?|png|svg|ico|jpg|webp)$ {
        expires 1d;
        try_files $uri =404;
    }
}
